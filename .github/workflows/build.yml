name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag (e.g. v1.5.0) to create or update its GitHub release; empty = build only'
        required: false
        default: ''

# Build check only: no EXE is published from here. The EXE embeds a GPL-3.0 libmpv whose exact
# Corresponding Source cannot be provided (the upstream build does not record the revisions of
# its libraries), so viBro is distributed as source only (docs/DECISIONS.md, D-052).
# The release job (1.6.0, D-066) publishes only the notes of the version from CHANGELOG.md; GitHub adds
# the source archives of the tag by itself. No EXE, no zip, no ffmpeg.exe.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (downloads and verifies pinned libmpv)
        shell: pwsh
        run: ./build/build.ps1 -Configuration Release

      - name: Package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./build/package.ps1 -ExpectedTag $tag

      # No upload-artifact: the zip stays on the runner and is discarded (the release job adds no files).

  release:
    # On a pushed tag v*, after the build check passed; or by hand for an existing tag (Actions ->
    # build -> Run workflow -> release_tag). Creates the release, or updates its notes if it exists.
    needs: build
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # all tags: only the highest version becomes "Latest"

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          # The section "## [x.y.z] - date" up to the next "## [".
          awk -v head="## [${ver}]" 'index($0, "## [") == 1 { if (p) exit; if (index($0, head) == 1) { p = 1; next } } p' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "No section [${ver}] in CHANGELOG.md" >&2
            exit 1
          fi
          {
            echo
            echo '---'
            echo 'Source only (no EXE, see docs/DECISIONS.md D-052): download the source archive below and run `build.cmd` (README, "Getting viBro"). `ffmpeg.exe` (optional, used by some features) is not included.'
            echo
            echo 'Solo sorgente (nessun EXE, vedi D-052): scaricare l'"'"'archivio del sorgente qui sotto ed eseguire `build.cmd` (README, "Come ottenere viBro"). `ffmpeg.exe` (facoltativo, usato da alcune funzioni) non è incluso.'
          } >> notes.md
          cat notes.md

      - name: Create or update the release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "viBro ${TAG#v}" --notes-file notes.md
          else
            highest="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
            latest=false
            if [ "$TAG" = "$highest" ]; then latest=true; fi
            gh release create "$TAG" --verify-tag --title "viBro ${TAG#v}" --notes-file notes.md --latest="$latest"
          fi
